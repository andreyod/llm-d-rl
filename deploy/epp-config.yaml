# Burst prefix-cache EPP config for verl (prefix-dominant profile).
# Pipeline: token-producer -> burst-prefix-cache-producer -> prefix-cache-scorer.
# Profile is prefix-cache-scorer (2) + load-aware-scorer (1) with max-score-picker, so the
# burst producer's within-window group co-location wins over load-balancing 2:1. This mirrors
# the inference-scheduler burst sample. Extended with file-discovery (verl file-based endpoint
# discovery) and vllmhttp-parser token_ids.

apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

plugins:
  - name: file-discovery
    type: file-discovery
    parameters:
      path: /tmp/epp-endpoints.yaml
      watchFile: true

  - name: prefix-cache-scorer
    type: prefix-cache-scorer
    parameters:
      # Score on the burst producer's within-window grouping instead of the
      # default persistent/approximate prefix cache. NOTE: this replaces
      # cross-step warm-cache scoring with within-step group co-location.
      prefixMatchInfoProducerName: burst-prefix-cache-producer

  - name: burst-prefix-cache-producer
    type: burst-prefix-cache-producer
    parameters:
      # Co-locate the G group-samples of a prompt onto one replica instead of
      # scattering them on a cold cache (the RL rollout group-scatter problem).
      # windowDurationMs must be wide enough to capture a whole rollout step's
      # same-prompt samples (verl dispatches them in one burst); too small ->
      # partial grouping. It adds up to windowDurationMs latency per request.
      windowDurationMs: 100
      maxPerReplica: -1     # -1 = whole group to one replica (max co-location)
      # Longest-prefix-match grouping (burst-longest build): group by shared
      # prefix at block granularity rather than whole-prompt identity.
      blockSizeTokens: 64   # prefix block size used for match length
      minColocateBlocks: 1  # min matching blocks required to co-locate a request
      maxBatchSize: 10000
      

  - name: load-aware-scorer
    type: load-aware-scorer

  - name: max-score-picker
    type: max-score-picker

  - name: metrics-source
    type: metrics-data-source

  - name: metrics-extractor
    type: core-metrics-extractor

  - name: vllmhttp-parser
    type: vllmhttp-parser

requestHandler:
  parsers:
    - pluginRef: vllmhttp-parser

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: prefix-cache-scorer
        weight: 2
      - pluginRef: load-aware-scorer
        weight: 1
      - pluginRef: max-score-picker

dataLayer:
  discovery:
    pluginRef: file-discovery
  sources:
    - pluginRef: metrics-source
      extractors:
        - pluginRef: metrics-extractor

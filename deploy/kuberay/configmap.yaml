# ConfigMap generated from the standalone config files in this directory.
#
# `bash deploy/deploy.sh apply` (or `deploy.sh configmap`) builds this from the
# standalone files into the namespace set in deploy.env - you normally do not run
# kubectl by hand. The equivalent manual command is:
#
#   kubectl create configmap llmd-epp-configs \
#     --from-file=epp-config.yaml=deploy/epp-config.yaml \
#     --from-file=epp-config-pd.yaml=deploy/epp-config-pd.yaml \
#     --namespace "$NAMESPACE" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The standalone files (epp-config.yaml, epp-config-pd.yaml) are the source of
# truth. Edit those, then re-run deploy.sh to update the ConfigMap.
# Do NOT edit the embedded content here directly.

apiVersion: v1
kind: ConfigMap
metadata:
  name: llmd-epp-configs
  # namespace is set at creation time (deploy.sh --namespace "$NAMESPACE").
# --- content managed via kubectl create configmap --from-file (see header) ---

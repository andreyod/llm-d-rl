apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: verl-cluster
  namespace: ezraverl
spec:
  rayVersion: '2.47.1'
  headGroupSpec:
    rayStartParams:
      num-cpus: "4"
    template:
      spec:
        # Co-locate the head on the same node as the worker. EPP and Envoy run on
        # the head, so keeping it on the worker's node keeps rollout routing on-node.
        # The worker is anchored to a GPU node by its nvidia.com/gpu request; the head
        # follows it via podAffinity (head -> worker, one direction, to avoid deadlock).
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  ray.io/cluster: verl-cluster
                  ray.io/node-type: worker
              topologyKey: kubernetes.io/hostname
        # EPP is NOT baked into the verl image. At pod start the fetch-epp init
        # container pulls the SEPARATE (public) EPP image with crane and extracts
        # its /app/epp binary into the shared epp-bin volume, which ray-head then
        # launches via VERL_EPP_BINARY (/opt/epp-bin/epp). So iterating on the EPP
        # is: push a new EPP image tag + recreate this pod - the verl image never
        # rebuilds. push-epp.sh covers the faster no-recreate inner loop.
        initContainers:
        - name: fetch-epp
          # Generic registry tool pinned by digest (go-containerregistry crane
          # :debug, which ships /busybox/sh + /busybox/tar). Never rebuilt.
          image: gcr.io/go-containerregistry/crane@sha256:1b1fb24d2b1bb27a9daf81a588157e68463876904e8e537a812edba6284fb252
          command: ["/busybox/sh", "-c"]
          args:
          - '/ko-app/crane export --platform linux/amd64 "$EPP_IMAGE" - | /busybox/tar -xOf - app/epp > /opt/epp-bin/epp && chmod +x /opt/epp-bin/epp'
          env:
          # The only knob: bump this tag to change the EPP version a recreated
          # pod boots with. Must be an anonymously-pullable (public) image.
          - name: EPP_IMAGE
            value: "ghcr.io/ezrasilvera/llm-d-router-endpoint-picker:burst-longest"
          volumeMounts:
          - mountPath: /opt/epp-bin
            name: epp-bin
        containers:
        - name: ray-head
          image: ghcr.io/ezrasilvera/verl:burst-scorer # Built from docker/Dockerfile.verl-vllm018-llm-d-integration
          imagePullPolicy: Always
          lifecycle:
            postStart:
              exec:
                command:
                - /bin/bash
                - -c
                - |
                  exec > /tmp/setup_log.txt 2>&1
                  echo "Starting setup..."

                  pip install --no-deps git+https://github.com/NaomiEisen/llm-d-rl-verl-integration

                  # Prepare data and prefetch the model.
                  mkdir -p /tmp/verl/hf_cache/datasets

                  # Generate training data
                  python3 /opt/verl/examples/data_preprocess/gsm8k.py --local_save_dir /tmp/verl/data/gsm8k

                  # Pre-fetch model weights (tokenizer/config only on head)
                  python3 -c "
                  from huggingface_hub import snapshot_download
                  snapshot_download('Qwen/Qwen3-4B', local_dir='/tmp/verl/models/Qwen3-4B',
                      ignore_patterns=['*.safetensors', '*.bin', '*.pt'],
                      local_dir_use_symlinks=False)
                  "
                  echo "Setup complete" > /tmp/verl_ready.txt
          env:
          # --- Runtime paths ---
          - name: HOME
            value: "/tmp"

          # --- HuggingFace cache ---
          - name: HF_HOME
            value: "/tmp/verl/hf_cache"
          - name: HF_DATASETS_CACHE
            value: "/tmp/verl/hf_cache/datasets"
          - name: XDG_CACHE_HOME
            value: "/tmp/verl/hf_cache"
          - name: HUGGINGFACE_HUB_CACHE
            value: "/tmp/verl/hf_cache"

          # --- Compile / framework caches ---
          - name: TRITON_CACHE_DIR
            value: "/tmp/triton"
          - name: FLASHINFER_WORKSPACE_DIR
            value: "/tmp/flashinfer"

          # --- Experiment tracking ---
          - name: WANDB_MODE
            value: "offline"

          # --- verl logging ---
          - name: VERL_LOGGING_LEVEL
            value: "INFO"
          - name: VERL_FILE_LOGGER_ROOT
            value: "/tmp/verl/logs"

          # --- EPP binary path (filled by the fetch-epp init container) ---
          # EPP is not in the verl image; fetch-epp extracts it from the separate
          # EPP image into /opt/epp-bin, and push-epp.sh can overwrite it live.
          # The actor launches whatever binary is here.
          - name: VERL_EPP_BINARY
            value: "/opt/epp-bin/epp"

          # --- vLLM / Ray settings ---
          - name: VLLM_USE_V1
            value: "1"
          - name: TOKENIZERS_PARALLELISM
            value: "false"
          - name: OMP_NUM_THREADS
            value: "1"

          # --- NCCL ---
          - name: NCCL_DEBUG
            value: "INFO"

          # --- llm-d integration debug logging (default: quiet) ---
          # Uncomment to enable verbose output from integration components.
          # See README ## Debug logging for details.
          # - name: VERL_VLLM_LOG_LEVEL
          #   value: "DEBUG"
          # - name: VERL_SIDECAR_LOG_LEVEL
          #   value: "5"
          # - name: VERL_EPP_VERBOSITY
          #   value: "5"
          # - name: VERL_ENVOY_LOG_LEVEL
          #   value: "debug"

          resources:
            limits:
              cpu: "32"
              memory: "96G"
              # No GPU on head — it only runs the driver (fit() loop) and Ray GCS.
              # FSDP training and NCCL broadcast happen on worker pods.
            requests:
              cpu: "24"
              memory: "64G"
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          - containerPort: 8081
            name: envoy
          volumeMounts:
          # Writable (not readOnly): push-epp.sh kubectl-cp's into here at runtime.
          - mountPath: /opt/epp-bin
            name: epp-bin
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /etc/llmd-configs
            name: llmd-epp-configs
            readOnly: true
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "32Gi"
        - name: llmd-epp-configs
          configMap:
            name: llmd-epp-configs
        # Shared scratch: fetch-epp (init) extracts the EPP binary here and
        # ray-head reads it at /opt/epp-bin (VERL_EPP_BINARY); push-epp.sh can
        # overwrite it live. Starts empty on a fresh pod.
        - name: epp-bin
          emptyDir: {}

  workerGroupSpecs:
  # GPU workers: resource requests must match verl-training-config.yaml pool sizes.
  # Current verl config uses 1 training GPU + 1 standalone rollout GPU on one node
  # (trainer.n_gpus_per_node=1, rollout.n_gpus_per_node=1) → 2 GPUs per worker pod.
  # Raise replicas/maxReplicas only if you add nodes and adjust verl nnodes / n_gpus_per_node.
  - groupName: fsdp-workers
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-cpus: "48"   # limit Ray's visible CPUs to reduce internal thread spawning
    template:
      spec:
        # No node pinning: the nvidia.com/gpu request anchors this worker to a GPU
        # node, and the head co-locates onto whatever node it lands on (see head
        # podAffinity above). The head must NOT also be referenced here, or mutual
        # required affinity would deadlock the scheduler.
        # Exclude nodes with known-faulty GPUs (device plugin "GPU is lost" admission
        # errors) so the scheduler does not keep retrying them. Add hostnames as needed.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                  - pokprod-b93r44s3
        containers:
        - name: ray-worker
          image: ghcr.io/ezrasilvera/verl:burst-scorer # Built from docker/Dockerfile.verl-vllm018-llm-d-integration
          imagePullPolicy: Always
          lifecycle:
            postStart:
              exec:
                command:
                - /bin/bash
                - -c
                - |
                  exec > /tmp/setup_log.txt 2>&1
                  pip install --no-deps git+https://github.com/NaomiEisen/llm-d-rl-verl-integration
                  mkdir -p /tmp/verl/hf_cache/datasets
                  python3 /opt/verl/examples/data_preprocess/gsm8k.py --local_save_dir /tmp/verl/data/gsm8k
                  # Full model weights for FSDP training + vLLM rollout
                  python3 -c "
                  from huggingface_hub import snapshot_download
                  snapshot_download('Qwen/Qwen3-4B', local_dir='/tmp/verl/models/Qwen3-4B',
                      local_dir_use_symlinks=False)
                  "
                  echo "Setup complete" > /tmp/verl_ready.txt
          env:
          # --- Runtime paths ---
          - name: HOME
            value: "/tmp"

          # --- HuggingFace cache ---
          - name: HF_HOME
            value: "/tmp/verl/hf_cache"
          - name: HF_DATASETS_CACHE
            value: "/tmp/verl/hf_cache/datasets"
          - name: XDG_CACHE_HOME
            value: "/tmp/verl/hf_cache"
          - name: HUGGINGFACE_HUB_CACHE
            value: "/tmp/verl/hf_cache"

          # --- Compile / framework caches ---
          - name: TRITON_CACHE_DIR
            value: "/tmp/triton"

          # --- Experiment tracking ---
          - name: WANDB_MODE
            value: "offline"

          # --- verl logging ---
          - name: VERL_LOGGING_LEVEL
            value: "INFO"

          # --- vLLM / Ray settings ---
          - name: VLLM_USE_V1
            value: "1"
          - name: PYTORCH_CUDA_ALLOC_CONF
            # CuMemAllocator (used by vLLM sleep/wake) is incompatible with expandable_segments.
            value: "expandable_segments:False"
          - name: TOKENIZERS_PARALLELISM
            value: "false"
          - name: OMP_NUM_THREADS
            value: "1"
          - name: RAY_max_grpc_threads
            value: "32"

          # --- NCCL ---
          - name: NCCL_DEBUG
            value: "INFO"

          # --- llm-d integration debug logging (default: quiet) ---
          # Uncomment to enable verbose output from integration components.
          # See README ## Debug logging for details.
          # - name: VERL_VLLM_LOG_LEVEL
          #   value: "DEBUG"
          # - name: VERL_SIDECAR_LOG_LEVEL
          #   value: "5"
          # - name: VERL_EPP_VERBOSITY
          #   value: "5"
          # - name: VERL_ENVOY_LOG_LEVEL
          #   value: "debug"

          resources:
            # --- Option A: 8 GPUs ---
            # limits:
            #   cpu: "64"
            #   memory: "256G"
            #   nvidia.com/gpu: "8"
            # requests:
            #   cpu: "48"
            #   memory: "192G"
            #   nvidia.com/gpu: "8"
            # --- Option B: 4 GPUs ---
            limits:
              cpu: "32"
              memory: "128G"
              nvidia.com/gpu: "4"
            requests:
              cpu: "16"
              memory: "96G"
              nvidia.com/gpu: "4"
          volumeMounts:
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /etc/llmd-configs
            name: llmd-epp-configs
            readOnly: true
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
        - name: llmd-epp-configs
          configMap:
            name: llmd-epp-configs

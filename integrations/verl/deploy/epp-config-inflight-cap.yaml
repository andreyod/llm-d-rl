# EPP config for a per-endpoint concurrency CAP + queue.
# = epp-config-inflight.yaml + a per-pool concurrency saturation detector wired
# into the flow-control layer, so over-cap requests are queued (EnqueueAndWait)
# instead of over-admitted.
#
# maxConcurrency below is the per-endpoint cap C - sweep it per workload/fleet
# size via EPP_CAP_CONFIG (run_test.sh --mode epp-fc) rather than editing this
# file in place. Fed by the same inflight-load-producer whose in-flight count
# is kept honest by actor_rollout_ref.rollout.custom.epp_report_completion=true
# (EPPLLMClient.begin()/complete() reporting the response phase back to EPP).

apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

# Enable the flow-control layer the NON-deprecated way: a config featureGate.
# LoadRawConfig parses this into r.featureGates, which initAdmissionControl
# (runner.go:873) checks to select FlowControlAdmissionController (the
# EnqueueAndWait queue) instead of the legacy saturation-only controller. The
# deprecated ENABLE_EXPERIMENTAL_FLOW_CONTROL_LAYER env var does NOT work: it
# appends to rawConfig.FeatureGates AFTER r.featureGates is already set, so it
# is ignored (silently falls back to legacy). Use this gate instead.
featureGates:
  - flowControl

plugins:
  - name: file-discovery
    type: file-discovery
    parameters:
      path: /tmp/epp-endpoints.yaml
      watchFile: true

  - name: vllmhttp-parser
    type: vllmhttp-parser

  - name: inflight-load-producer
    type: inflight-load-producer

  - name: active-request-scorer
    type: active-request-scorer
    parameters:
      inFlightLoadProducerName: inflight-load-producer

  - name: concurrency-detector
    type: concurrency-detector
    parameters:
      maxConcurrency: 8           # per-endpoint cap C - tune per fleet size/workload
      headroom: 0
      concurrencyMode: requests
      inFlightLoadProducerName: inflight-load-producer

  - name: max-score-picker
    type: max-score-picker

  - name: metrics-source
    type: metrics-data-source
  - name: metrics-extractor
    type: core-metrics-extractor

requestHandler:
  parsers:
    - pluginRef: vllmhttp-parser

flowControl:
  saturationDetector:
    pluginRef: concurrency-detector

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: max-score-picker

dataLayer:
  discovery:
    pluginRef: file-discovery
  sources:
    - pluginRef: metrics-source
      extractors:
        - pluginRef: metrics-extractor

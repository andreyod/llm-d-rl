# EPP config that routes on EPP's OWN in-flight counter rather than vLLM-scraped
# metrics.
#
# Unlike the shipped epp-config.yaml (prefix-cache-scorer w2 + load-aware-scorer
# w1, both fed by vLLM-scraped metrics), this config routes via
# inflight-load-producer + active-request-scorer - the lag-free,
# full-generation-window signal, and the only signal a per-endpoint
# concurrency cap (see epp-config-inflight-cap.yaml) can bind on.
#
# REQUIRES completion reporting: set
# actor_rollout_ref.rollout.custom.epp_report_completion=true (run_test.sh
# --mode epp-inflight / epp-fc), which makes EPPLLMClient keep the ext_proc
# stream open through generation and report the response phase back to EPP
# (EPPGrpcClient.begin()/complete()) instead of half-closing right after the
# routing decision. With report_completion left off (the default, --mode epp),
# the counter decays at pick time and neither this scorer nor a cap would see
# real load.
#
# Watch it live on the EPP metrics port:
#   curl -s <epp-host>:9090/debug/plugins/state | jq .

apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

plugins:
  - name: file-discovery
    type: file-discovery
    parameters:
      path: /tmp/epp-endpoints.yaml
      watchFile: true

  - name: vllmhttp-parser
    type: vllmhttp-parser

  # In-flight producer: increments on PreRequest (endpoint chosen), decrements on
  # ResponseBody EndOfStream / OnEvicted (the completion signal from verl), with
  # the 5-min PluginState TTL janitor as a backstop.
  - name: inflight-load-producer
    type: inflight-load-producer

  # Route to the least-in-flight endpoint.
  - name: active-request-scorer
    type: active-request-scorer
    parameters:
      inFlightLoadProducerName: inflight-load-producer

  # (Optional) token-based balancing instead of / in addition to request count -
  # better for workloads with very uneven per-request sizes.
  # - name: token-load-scorer
  #   type: token-load-scorer
  #   parameters:
  #     inFlightLoadProducerName: inflight-load-producer

  - name: max-score-picker
    type: max-score-picker

  - name: metrics-source
    type: metrics-data-source
  - name: metrics-extractor
    type: core-metrics-extractor

requestHandler:
  parsers:
    - pluginRef: vllmhttp-parser

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: max-score-picker

dataLayer:
  discovery:
    pluginRef: file-discovery
  sources:
    - pluginRef: metrics-source
      extractors:
        - pluginRef: metrics-extractor

# --- Per-GPU concurrency cap C (the flow-control lever) ---
# For a per-endpoint concurrency cap + queue instead of pure routing, use
# epp-config-inflight-cap.yaml instead of this file (--mode epp-fc): it adds the
# concurrency-detector plugin wired into the flowControl feature gate, so
# over-cap requests are queued (EnqueueAndWait) until a completion frees a slot.

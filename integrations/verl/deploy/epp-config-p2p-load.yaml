# P2P KV-cache sharing with LOAD-ONLY routing (no burst/prefix-affinity), matching
# upstream's epp-load-p2p.yaml arm: destination picking is purely load-aware-scorer,
# decoupled from where any prefix is cached, so p2p-source-producer's pull actually
# has something to do. Contrast with epp-config-p2p.yaml (burst + prefix-cache-scorer),
# where the destination is already chosen for prefix locality most of the time, which
# can mask whether the P2P pull path itself works - "pull is essential to make
# scattering viable" per the upstream guide's own framing of this exact arm.
#
# p2p-source-producer omits prefixMatchInfoProducerName, auto-wiring the default
# (unnamed) approximate prefix-cache producer per its own README - that producer just
# tracks per-endpoint cache state passively here, since nothing else in this config
# scores on it (no prefix-cache-scorer, no burst-prefix-cache-producer at all).

apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

plugins:
  - name: file-discovery
    type: file-discovery
    parameters:
      path: /tmp/epp-endpoints.yaml
      watchFile: true

  - name: load-aware-scorer
    type: load-aware-scorer

  - name: max-score-picker
    type: max-score-picker

  - name: p2p-source-producer
    type: p2p-source-producer
    parameters:
      minCachedTokenDelta: 2048

  - name: metrics-source
    type: metrics-data-source

  - name: metrics-extractor
    type: core-metrics-extractor

  - name: vllmhttp-parser
    type: vllmhttp-parser

requestHandler:
  parsers:
    - pluginRef: vllmhttp-parser

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: load-aware-scorer
      - pluginRef: max-score-picker

dataLayer:
  discovery:
    pluginRef: file-discovery
  sources:
    - pluginRef: metrics-source
      extractors:
        - pluginRef: metrics-extractor
